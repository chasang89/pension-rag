services:
  elasticsearch:
    build:
      context: ../..
      dockerfile: infra/docker/Dockerfile.elasticsearch
    image: pension-rag/elasticsearch:8.15.0-nori
    container_name: pension-rag-es
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false
      - "ES_JAVA_OPTS=-Xms1g -Xmx1g"
    ports:
      - "9200:9200"
    volumes:
      - es_data:/usr/share/elasticsearch/data
    healthcheck:
      test: ["CMD-SHELL", "curl -s http://localhost:9200/_cluster/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10

  rag-core:
    build:
      context: ../..
      dockerfile: infra/docker/Dockerfile.rag-core
    image: pension-rag/rag-core:0.1.0
    container_name: pension-rag-core
    environment:
      - ES_URL=http://elasticsearch:9200
    volumes:
      # 코퍼스는 이미지에 굽지 않고 읽기 전용으로 마운트한다
      - ../../rag-core/data:/app/data:ro
      # bge-m3(약 2GB) 재다운로드 방지
      - hf_cache:/app/.cache/huggingface
    ports:
      - "8000:8000"
    depends_on:
      elasticsearch:
        condition: service_healthy

  gateway:
    build:
      context: ../..
      dockerfile: infra/docker/Dockerfile.gateway
    image: pension-rag/gateway:0.1.0
    container_name: pension-rag-gateway
    environment:
      - RAG_CORE_URL=http://rag-core:8000
    ports:
      - "8080:8080"
    depends_on:
      rag-core:
        condition: service_healthy

volumes:
  es_data:
  hf_cache:
